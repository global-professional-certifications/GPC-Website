  <!-- Hide Chatbot Widget (Disabled temporarily for chatbot improvements) -->
  <style>
    #zsiqscript, #zsiq_float, .zsiq_floatmain, .zsiq_theme1, .zsiq_theme2, .zsiq_cnt, #zcontent, div[siq_id], iframe[id*="zsiq"], iframe[title*="Zoho"], iframe[title*="SalesIQ"], [id*="zsiq"], .zsiq-widget, .zsiq_custombtn, #zsiq_chat {

  <!-- Third-Party Scripts - Load on Interaction -->
  <script>
    // Stub Zoho SalesIQ & block chatbot DOM injection
    window.$zoho = window.$zoho || {};
    window.$zoho.salesiq = {
      ready: function () { },
      widgetcode: "",
      values: {},
      readyFunction: [],
      floatwindow: { visible: function () { return "hide"; } },
      chat: { start: function () { } }
    };

    if (typeof MutationObserver !== 'undefined') {
      const chatObserver = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          mutation.addedNodes.forEach(function (node) {
            if (node.nodeType === 1) {
              var id = (node.id || '').toLowerCase();
              var className = (typeof node.className === 'string' ? node.className : '').toLowerCase();
              var src = (node.src || '').toLowerCase();
              if (id.includes('zsiq') || className.includes('zsiq') || src.includes('salesiq')) {
                try { node.remove(); } catch (e) { if (node.parentNode) node.parentNode.removeChild(node); }
              }
            }
          });
        });
      });
      chatObserver.observe(document.documentElement, { childList: true, subtree: true });
    }

    (function () {
      let scriptLoaded = false;
      function loadScripts() {
        if (scriptLoaded) return;
        scriptLoaded = true;

        // Load GTM
        (function (w, d, s, l, i) {
          w[l] = w[l] || []; w[l].push({
            'gtm.start':
              new Date().getTime(), event: 'gtm.js'
          }); var f = d.getElementsByTagName(s)[0],
            j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
              'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);
        })(window, document, 'script', 'dataLayer', 'GTM-NC8J7N42');

        // Load Zoho SalesIQ (Disabled temporarily for chatbot improvements)
        /*
        window.$zoho = window.$zoho || {};
        $zoho.salesiq = $zoho.salesiq || { ready: function () { } };
        var s = document.createElement("script");
        s.id = "zsiqscript";
        s.src = "https://salesiq.zohopublic.in/widget?wc=siqf35804132e65c49b7d29d4a0685cd42d624236b97d32b42c0c692f0601766c17f529b5932a53b4ef8a440086e89cf8ae";
        s.defer = true;
        document.body.appendChild(s);
        */

        // Remove listeners
        window.removeEventListener('scroll', loadScripts);
        window.removeEventListener('mousemove', loadScripts);
        window.removeEventListener('touchstart', loadScripts);
      }

      // Trigger script loading on first interaction
      window.addEventListener('scroll', loadScripts, { passive: true, once: true });
      window.addEventListener('mousemove', loadScripts, { passive: true, once: true });
      window.addEventListener('touchstart', loadScripts, { passive: true, once: true });
      window.addEventListener('keydown', loadScripts, { passive: true, once: true });
      window.addEventListener('click', loadScripts, { passive: true, once: true });
    })();
  </script>
